name: family-budget

# Deployment topology (PLATFORM_DECISIONS §F, SECURITY_AND_OPERATIONS):
#
#   internet -> nginx :80/:443 (host, Let's Encrypt TLS)
#                  |
#         127.0.0.1:8080 (loopback publish only)
#                  |
#               api:8080
#                  |
#        +---------+---------+
#        |                   |
#     migrate            db:5432 (backend only, no host port)
#
# `backend` is an internal network: containers attached only to it (db) have no
# external route. PostgreSQL is never published to the host or the internet.
#
# `frontend` is a non-internal network used only by `api` so the loopback port
# publish is reliable. It carries no other service. The API's only host
# exposure is the loopback binding; the host's existing nginx proxies to it.
#
# Image pins (re-check the stable minor at upgrade time; never use `latest`):
#   postgres:18.6  - current PostgreSQL 18 stable minor at authoring time
# The api/migrate images are built locally from the pinned Dockerfile; the 1.0.0
# tag is an application release tag, not a floating upstream tag.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    # Compose interpolates these from .env; only the database container sees
    # the PostgreSQL credentials.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # PostgreSQL 18 moved PGDATA under /var/lib/postgresql (not .../data).
    #
    # Runtime tuning: the mounted file loads the initdb-generated
    # PGDATA/postgresql.conf (which keeps listen_addresses = '*') and then
    # overrides a handful of settings sized for a small shared VPS. It is
    # passed as config_file rather than dropped in conf.d because the official
    # image's generated config has no include_dir. Editing the file and
    # reloading applies reloadable settings; shared_buffers/max_connections
    # need a container restart. See deploy/postgres/README.md.
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/99-small-vps.conf"
    # Parallel query uses /dev/shm. 128 MB matches shared_buffers and is enough
    # for a household workload; the image default is only 64 MB.
    shm_size: 128mb
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres/99-small-vps.conf:/etc/postgresql/99-small-vps.conf:ro
    networks:
      - backend
    # Internal-only advertisement; never a host `ports:` mapping.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    # 768 MiB ceiling: 128 MiB shared_buffers + up to 3 autovacuum workers at
    # 64 MiB maintenance_work_mem + 25 backends + WAL/OS overhead. The tuned
    # settings target roughly 250-450 MiB steady state, leaving host headroom.
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768m

  # One-shot schema runner. The API never migrates on startup
  # (cmd/server/main.go); reviewed Goose migrations are the schema authority.
  # `docker compose up -d` runs it to completion before api starts.
  # Manual commands: `docker compose run --rm migrate status|up|down`.
  migrate:
    build:
      context: .
      target: migrate
    image: family-budget/migrate:1.0.0
    restart: "no"
    # The migrate binary builds the connection URL from these components; it
    # never accepts a user-supplied URL.
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m

  api:
    build:
      context: .
      target: runtime
    image: family-budget/api:1.0.0
    restart: unless-stopped
    # Every name below is read by internal/config/config.go. The database
    # connection is supplied as components; the server constructs the URL
    # internally. Defaults match config.Default so a minimal .env still starts.
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      # Bounded pool, well inside PostgreSQL's max_connections = 25.
      DATABASE_MAX_OPEN_CONNS: ${DATABASE_MAX_OPEN_CONNS:-10}
      DATABASE_MAX_IDLE_CONNS: ${DATABASE_MAX_IDLE_CONNS:-5}
      DATABASE_CONN_MAX_LIFETIME: ${DATABASE_CONN_MAX_LIFETIME:-1h}
      DATABASE_CONN_MAX_IDLE_TIME: ${DATABASE_CONN_MAX_IDLE_TIME:-15m}
      # Soft Go heap ceiling below the 256 MiB container limit, and a scheduler
      # width matched to the API's CPU budget.
      GOMEMLIMIT: ${GOMEMLIMIT:-192MiB}
      GOMAXPROCS: ${GOMAXPROCS:-2}
      PORT: ${PORT:-8080}
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-15s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-15s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
      HTTP_REQUEST_TIMEOUT: ${HTTP_REQUEST_TIMEOUT:-10s}
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-10s}
      HTTP_MAX_BODY_BYTES: ${HTTP_MAX_BODY_BYTES:-1048576}
      AUTH_ARGON2_TIME: ${AUTH_ARGON2_TIME:-3}
      AUTH_ARGON2_MEMORY_KIB: ${AUTH_ARGON2_MEMORY_KIB:-65536}
      AUTH_ARGON2_THREADS: ${AUTH_ARGON2_THREADS:-4}
      AUTH_ARGON2_KEY_LENGTH: ${AUTH_ARGON2_KEY_LENGTH:-32}
      AUTH_ARGON2_SALT_LENGTH: ${AUTH_ARGON2_SALT_LENGTH:-16}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-720h}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      AUTH_RATE_LIMIT_WINDOW: ${AUTH_RATE_LIMIT_WINDOW:-1m}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
      - frontend
    # Loopback-only host binding. The host's existing nginx is the sole public
    # front door; nothing is exposed on 0.0.0.0. API_HOST_PORT only changes the
    # loopback port, not the public surface.
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:${PORT:-8080}"
    healthcheck:
      # /readyz pings PostgreSQL, so an unready API is not proxied to by nginx.
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:$${PORT}/readyz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    # 256 MiB ceiling with GOMEMLIMIT=192MiB: static Go binary ~20 MiB, request
    # buffers <=1 MiB each and one 64 MiB Argon2id hash at a time. The 0.75 CPU
    # ceiling keeps login hashing and normal traffic from starving the host.
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256m

networks:
  # No route to the outside world; db lives here only.
  backend:
    internal: true
  # Non-internal edge for api; needed for a reliable loopback publish.
  frontend:

volumes:
  pgdata:
