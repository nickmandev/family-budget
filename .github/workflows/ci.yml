name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_POSTGRES_DSN: postgres://test:test@127.0.0.1:5432/test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'unformatted files:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # No DSN: the PostgreSQL adapter tests skip themselves, so this is the
      # database-independent unit run.
      - name: Unit tests
        run: go test -count=1 ./...
        env:
          TEST_POSTGRES_DSN: ""

      - name: Integration suite (real PostgreSQL)
        run: scripts/integration-test.sh --all

      - name: Race
        run: go test -count=1 -race ./...
