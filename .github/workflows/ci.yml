name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # TEST_POSTGRES_* is the mirror of the application connection components.
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_PORT: 5432
      TEST_POSTGRES_USER: test
      TEST_POSTGRES_PASSWORD: test
      TEST_POSTGRES_DB: test
      TEST_POSTGRES_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'unformatted files:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # No TEST_POSTGRES_HOST: the PostgreSQL adapter tests skip themselves,
      # so this is the database-independent unit run.
      - name: Unit tests
        run: go test -count=1 ./...
        env:
          TEST_POSTGRES_HOST: ""

      - name: Integration suite (real PostgreSQL)
        run: scripts/integration-test.sh --all

      - name: Race
        run: go test -count=1 -race ./...


  publish-release:
    name: Publish release images to GHCR
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and ancestry
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH (for example v1.2.3). Got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Refusing to deploy: release tag $GITHUB_REF_NAME does not point to a commit on origin/main." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Normalize image owner
        id: image
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/family-budget-api:${{ steps.release.outputs.version }}

      - name: Publish migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: migrate
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/family-budget-migrate:${{ steps.release.outputs.version }}
