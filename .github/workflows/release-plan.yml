name: Release plan

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-plan-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: bash scripts/next-version.sh

  tag:
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create and push release tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.plan.outputs.tag }}" -m "Release ${{ needs.plan.outputs.tag }}"
          git push origin "${{ needs.plan.outputs.tag }}"

  # Images and release notes run through workflow_call on the tag computed
  # above, so the pipeline needs no PAT and has no GITHUB_TOKEN recursion.
  images:
    needs: [plan, tag]
    if: needs.plan.outputs.should_release == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-images.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}

  release:
    needs: [plan, images]
    if: needs.plan.outputs.should_release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-notes.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
