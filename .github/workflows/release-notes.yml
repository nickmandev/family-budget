name: Release notes

on:
  workflow_run:
    workflows: ["Release images"]
    types: [completed]

permissions:
  contents: read

jobs:
  release:
    name: Create GitHub release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Generate release notes and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          body="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$TAG" --jq .body)"
          images="$(printf 'Container images:\n- `ghcr.io/%s/family-budget-api:%s`\n- `ghcr.io/%s/family-budget-migrate:%s`' "$owner" "$version" "$owner" "$version")"
          notes="${body}"$'\n\n'"${images}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes "$notes"
          else
            gh release create "$TAG" --title "$TAG" --notes "$notes" --verify-tag
          fi
