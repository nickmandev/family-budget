name: Release images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (e.g. v1.2.0)
        required: true
        type: string

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    name: Publish release images to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and ancestry
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH (for example v1.2.3). Got: $TAG" >&2
            exit 1
          fi
          # A dispatch run checks out main, so resolve the tag's own commit
          # instead of trusting the checked-out SHA.
          git fetch origin --tags
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          fi
          tag_sha=$(git rev-parse "refs/tags/$TAG^{commit}")
          git fetch origin main
          if ! git merge-base --is-ancestor "$tag_sha" origin/main; then
            echo "Refusing to deploy: release tag $TAG ($tag_sha) does not point to a commit on origin/main." >&2
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Normalize image owner
        id: image
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/family-budget-api:${{ steps.release.outputs.version }}

      - name: Publish migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: migrate
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/family-budget-migrate:${{ steps.release.outputs.version }}
