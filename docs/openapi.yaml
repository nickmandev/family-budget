          format: uuid
          nullable: true
          description: Null for a ready-to-assign deficit.
        amount_minor:
          $ref: '#/components/schemas/MinorUnits'
    Balances:
      type: object
      required: [currency, budgetable_cash_minor, ready_to_assign_minor, resolution, accounts, envelopes, deficits]
      properties:
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        budgetable_cash_minor:
          $ref: '#/components/schemas/MinorUnits'
