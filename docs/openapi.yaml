      properties:
        envelope_id:
          type: string
          format: uuid
        name:
          type: string
        balance_minor:
          $ref: '#/components/schemas/MinorUnits'
        reserved_minor:
          $ref: '#/components/schemas/MinorUnits'
        spendable_minor:
          $ref: '#/components/schemas/MinorUnits'
    Deficit:
      type: object
      required: [kind, envelope_id, amount_minor]
      properties:
