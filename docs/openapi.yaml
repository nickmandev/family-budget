      - $ref: '#/components/parameters/PlanID'
    post:
      tags: [Plans]
      operationId: completePlan
      summary: Complete a reserved plan as a committed transaction
      description: |
        Posts exactly one purchase or repayment operation, releases the holds
        and moves the plan to `COMPLETED`. Financial mutation; requires
        `Idempotency-Key`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: See the idempotency semantics in the API description.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletePlanRequest'
      responses:
        '200':
          description: Plan completed and purchase committed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanActionResponse'
        '400':
