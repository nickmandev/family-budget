        rejected with `ACCOUNT_SCOPE_CHANGE_REQUIRES_FUNDING_PLAN`.
      properties:
        from_ready_minor:
          type: integer
          format: int64
          nullable: true
        envelopes:
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeFunding'
    EnvelopeFunding:
      type: object
      required: [envelope_id, amount_minor]
      properties:
        envelope_id:
          type: string
          format: uuid
        amount_minor:
          $ref: '#/components/schemas/MinorUnits'
    TransferRequest:
      allOf:
        - $ref: '#/components/schemas/FinancialRequest'
        - type: object
          required: [source_account_id, destination_account_id, amount_minor]
          properties:
