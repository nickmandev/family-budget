      operationId: listSuggestions
      summary: List unconfirmed candidate transactions
      description: |
        Suggestions have no ledger postings and no reservations. They are not
        committed transactions.
      responses:
        '200':
          description: Suggestions.
          headers:
            X-Request-ID:
