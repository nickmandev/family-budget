      type: object
      required: [resolution, deficits]
      properties:
        resolution:
          $ref: '#/components/schemas/ResolutionStatus'
        deficits:
          type: array
          items:
            $ref: '#/components/schemas/Deficit'
    Plan:
      type: object
      description: |
        Planned purchase or repayment. A `DRAFT` holds no funds and is not a
        committed transaction; `RESERVED`/`RESERVED_EXCEPTION` hold funds; only
        `complete` creates a committed purchase operation.
      required: [id, kind, state, target_envelope_id, intended_amount_minor, held_amount_minor, held_on_account_minor]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/PlanKind'
        state:
          $ref: '#/components/schemas/PlanState'
        target_envelope_id:
          type: string
          format: uuid
        target_account_id:
          type: string
          format: uuid
          nullable: true
        intended_amount_minor:
          $ref: '#/components/schemas/MinorUnits'
        authorized_amount_minor:
          type: integer
          format: int64
          nullable: true
        held_amount_minor:
          $ref: '#/components/schemas/MinorUnits'
        held_on_account_minor:
          $ref: '#/components/schemas/MinorUnits'
        mode:
          allOf:
            - $ref: '#/components/schemas/AuthorizationMode'
          nullable: true
        reason:
          type: string
          nullable: true
