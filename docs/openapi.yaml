              type: string
              format: uuid
            destination_account_id:
              type: string
              format: uuid
            amount_minor:
              $ref: '#/components/schemas/MinorUnits'
            funding:
              allOf:
                - $ref: '#/components/schemas/Funding'
              nullable: true
    RefundRequest:
      allOf:
        - $ref: '#/components/schemas/FinancialRequest'
        - type: object
          required: [original_operation_id, envelope_id, amount_minor]
          properties:
            original_operation_id:
              type: string
              format: uuid
            account_id:
              type: string
              format: uuid
              nullable: true
              description: Cash account for a cash refund.
            card_account_id:
              type: string
              format: uuid
              nullable: true
              description: Card liability for a card refund.
            envelope_id:
              type: string
              format: uuid
            payment_envelope_id:
              type: string
              format: uuid
              nullable: true
            amount_minor:
              $ref: '#/components/schemas/MinorUnits'
    ReversalRequest:
      allOf:
        - $ref: '#/components/schemas/FinancialRequest'
        - type: object
          required: [original_operation_id, amount_minor, reason]
          properties:
            original_operation_id:
              type: string
              format: uuid
            amount_minor:
              $ref: '#/components/schemas/MinorUnits'
    ReplacementPurchase:
      type: object
      required: [purchase_kind, account_id, envelope_id, amount_minor]
