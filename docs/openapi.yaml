  /households/{id}/suggestions/{suggestionID}/convert:
    parameters:
      - $ref: '#/components/parameters/HouseholdID'
      - $ref: '#/components/parameters/SuggestionID'
    post:
      tags: [Suggestions]
      operationId: convertSuggestion
      summary: Convert a suggestion into a draft plan
      description: |
        The resulting plan is a `DRAFT` and has not reserved or committed
        anything. It must still be authorized and completed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertSuggestionRequest'
      responses:
        '200':
          description: Suggestion converted; draft plan returned.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionConvertResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /health:
    get:
      tags: [Health]
      operationId: apiHealth
      summary: Versioned API health check
      security: []
      responses:
        '200':
          description: API stack is serving.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /healthz:
    servers:
      - url: /
        description: Process root (outside the versioned API)
    get:
      tags: [Health]
      operationId: liveness
      summary: Liveness probe
      description: Process can serve HTTP; does not touch the database.
      security: []
      responses:
        '200':
          description: Alive.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    servers:
      - url: /
        description: Process root (outside the versioned API)
    get:
      tags: [Health]
      operationId: readiness
      summary: Readiness probe
      description: |
        Reports ready only when the database connectivity check succeeds within
        the probe timeout. Failures are generic and never expose the driver
        error.
      security: []
      responses:
        '200':
          description: Ready to receive traffic.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: session-token
      description: |
        Opaque session token returned by `POST /auth/login`. Send it as
        `Authorization: Bearer <token>`. Tokens expire and can be individually
        revoked; they are never logged or stored in plaintext.
  parameters:
    HouseholdID:
      name: id
      in: path
      required: true
      description: Household UUID.
      schema:
        type: string
        format: uuid
    UserID:
      name: userID
      in: path
      required: true
      description: User UUID.
      schema:
        type: string
        format: uuid
    AccountID:
      name: accountID
      in: path
      required: true
      description: Account UUID.
      schema:
        type: string
        format: uuid
    EnvelopeID:
      name: envelopeID
      in: path
      required: true
      description: Envelope UUID.
      schema:
        type: string
        format: uuid
    PlanID:
      name: planID
      in: path
      required: true
      description: Plan UUID.
      schema:
        type: string
        format: uuid
    SuggestionID:
      name: suggestionID
      in: path
      required: true
      description: Suggestion UUID.
      schema:
        type: string
        format: uuid
  headers:
    XRequestID:
      description: |
        Correlation id for this request. A well-formed inbound `X-Request-ID`
        is propagated; otherwise the server generates one. The same value
        appears in an error envelope's `request_id`.
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed request or an invalid value (400).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing, expired or revoked session (401).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        WWW-Authenticate:
          description: Bearer challenge.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated but not permitted (403).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: |
        Resource absent, or the caller is not an active household member. The
        two cases are deliberately indistinguishable.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: |
        State, idempotency or concurrency conflict (409).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: Request body exceeds the configured limit (413).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: |
        Well-formed but semantically unprocessable, such as insufficient
        funds, an amount-limit breach or a disallowed account-scope change
        (422).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: Rate limit exceeded (429).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Retry-After:
          description: Seconds until the caller may retry.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: |
        Internal failure (500). The response never exposes driver errors,
        stack traces or secrets.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: Service is not ready (503).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    GatewayTimeout:
      description: Request exceeded the handler timeout (504).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      description: The only error response shape the API returns.
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      required: [code, message, field, details, request_id]
      properties:
        code:
          type: string
          description: |
            Stable machine-readable code. The root `x-error-codes` extension is
            the authoritative code→HTTP-status table.
          enum:
            - HOUSEHOLD_ACCESS_DENIED
            - ENTITY_NOT_FOUND_OR_NOT_IN_HOUSEHOLD
            - INVALID_ENTITY_STATE
            - INVALID_AMOUNT
            - CURRENCY_MISMATCH
            - INSUFFICIENT_READY_TO_ASSIGN
            - INSUFFICIENT_ENVELOPE_FUNDS
            - INSUFFICIENT_ACCOUNT_FUNDS
            - OVERRIDE_REASON_REQUIRED
            - RESERVATION_MISMATCH
            - AMOUNT_EXCEEDS_AUTHORIZATION
            - REFUND_EXCEEDS_REMAINDER
            - REVERSAL_EXCEEDS_REMAINDER
            - IDEMPOTENCY_KEY_PAYLOAD_MISMATCH
            - CONCURRENCY_CONFLICT
            - ACCOUNT_SCOPE_CHANGE_REQUIRES_FUNDING_PLAN
            - ACCOUNTING_INVARIANT_VIOLATION
            - MONEY_OVERFLOW
            - AMOUNT_OUT_OF_RANGE
            - INVALID_VALUE
            - BAD_REQUEST
            - UNAUTHENTICATED
            - INVALID_CREDENTIALS
            - EMAIL_ALREADY_REGISTERED
            - RATE_LIMITED
            - PAYLOAD_TOO_LARGE
            - REQUEST_TIMEOUT
            - SERVICE_UNAVAILABLE
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - INTERNAL_ERROR
        message:
          type: string
          description: Safe, user-facing message. Never contains internal detail.
        field:
          type: string
          nullable: true
          description: Offending request field, or null when not field-specific.
        details:
          nullable: true
          description: Optional non-sensitive context, or null.
        request_id:
          type: string
          description: Correlation id, also returned as `X-Request-ID`.
    EffectiveDate:
      type: string
      format: date
      description: |
        Date-only calendar fact in the household timezone, `YYYY-MM-DD`. It is
        never obtained by converting a UTC instant.
      example: '2026-10-28'
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 UTC audit instant.
      example: '2026-10-28T12:00:00Z'
    CurrencyCode:
      type: string
      description: ISO-4217 code. The MVP uses one currency per household.
      pattern: '^[A-Z]{3}$'
      example: USD
    MinorUnits:
      type: integer
      format: int64
      description: |
        Integer amount in the currency's minor units. Money is never a
        floating-point value.
    LifecycleStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    MembershipRole:
      type: string
      enum: [OWNER, MEMBER]
    MembershipStatus:
      type: string
      enum: [ACTIVE, REMOVED]
    AccountKind:
      type: string
      description: Static nature of an account.
      enum: [CHECKING, SAVINGS, CASH_WALLET, CREDIT_CARD_LIABILITY]
    PlanKind:
      type: string
      description: |
        `PURCHASE` is a planned purchase; `REPAYMENT` is a planned card
        repayment that settles a liability rather than creating a second
        expense.
      enum: [PURCHASE, REPAYMENT]
    PlanState:
      type: string
      description: |
        `DRAFT` holds no funds; `RESERVED` and `RESERVED_EXCEPTION` hold funds
        without posting an expense; `COMPLETED` and `CANCELLED` are terminal.
      enum: [DRAFT, RESERVED, RESERVED_EXCEPTION, COMPLETED, CANCELLED]
    SuggestionState:
      type: string
      description: |
        Suggestions have no ledger effect. `CONFIRMED` and `CANCELLED` are
        terminal.
      enum: [SUGGESTED, EDITED, CONFIRMED, CANCELLED]
    OperationType:
      type: string
      description: Committed journal-operation type.
      enum:
        - OPENING_BALANCE
        - INCOME
        - REIMBURSEMENT
        - ALLOCATE
        - REALLOCATE
        - DEBIT_PURCHASE
        - CASH_PURCHASE
        - CARD_PURCHASE
        - CARD_PAYMENT
        - CARD_FEE_INTEREST
        - TRANSFER_ELIGIBLE
        - TRANSFER_TO_ELIGIBLE
        - TRANSFER_OUT_OF_SCOPE
        - TRANSFER_EXCLUDED
        - CASH_REFUND
        - CARD_REFUND
        - RESERVATION_CREATE
        - RESERVATION_RESIZE
        - RESERVATION_CANCEL
        - PURCHASE_COMPLETE
        - EXTERNAL_TRANSACTION
        - REVERSAL
        - REPLACEMENT
        - CATEGORY_CORRECTION
        - ACCOUNT_CORRECTION
        - METADATA_CORRECTION
        - RECONCILE_INCREASE
        - RECONCILE_DECREASE
    TransactionSource:
      type: string
      description: Provenance of a committed operation.
      enum: [MANUAL, PLANNED_PURCHASE, EXTERNAL_ENTRY, OPENING_BALANCE, RECONCILIATION]
    AuthorizationMode:
      type: string
      description: |
        `EMERGENCY_OVERRIDE` bypasses the normal envelope funding check and
        requires a nonblank reason, which is audited household-visibly.
      enum: [NORMAL, EMERGENCY_OVERRIDE]
    PurchaseKind:
      type: string
      description: Payment-method shape used to complete a plan.
      enum: [DEBIT, CASH, CARD, REPAYMENT]
    CorrectionKind:
      type: string
      enum: [TRANSACTION, CATEGORY, METADATA]
    PostingKind:
      type: string
      enum: [ACCOUNT, ENVELOPE]
    ResolutionStatus:
      type: string
      enum: [CLEAR, REQUIRES_RESOLUTION]
    DeficitKind:
      type: string
      enum: [READY_TO_ASSIGN, ENVELOPE]
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
    User:
      type: object
      required: [id, email, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        created_at:
          $ref: '#/components/schemas/Timestamp'
    Membership:
      type: object
      description: Household membership as seen from the authenticated user.
      required: [household_id, role, status, joined_at, removed_at]
      properties:
        household_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/MembershipRole'
        status:
          $ref: '#/components/schemas/MembershipStatus'
        joined_at:
          $ref: '#/components/schemas/Timestamp'
        removed_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 1024
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RegisterResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    LoginResponse:
      type: object
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          description: Opaque bearer session token. Shown only once.
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        user:
          $ref: '#/components/schemas/User'
    MeResponse:
      type: object
      required: [user, memberships]
      properties:
        user:
          $ref: '#/components/schemas/User'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
    Household:
      type: object
      required: [id, name, currency, timezone, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        timezone:
          type: string
          description: IANA timezone used to interpret `EffectiveDate`.
          example: Europe/London
        status:
          $ref: '#/components/schemas/LifecycleStatus'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    CreateHouseholdRequest:
      type: object
      required: [name, currency, timezone]
      properties:
        name:
          type: string
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        timezone:
          type: string
          example: Europe/London
    Member:
      type: object
      required: [user_id, role, status, joined_at, removed_at]
      properties:
        user_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/MembershipRole'
        status:
