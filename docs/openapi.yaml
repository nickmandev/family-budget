      properties:
        kind:
          type: string
          description: Relationship such as `REVERSAL_OF` or `REFUND_OF`.
        operation_id:
          type: string
          format: uuid
    Transaction:
      type: object
      description: |
        Immutable committed journal operation. `effective_date` is a household-
        local calendar date; `committed_at` is an audit instant.
      required: [id, type, source, effective_date, currency, amount_minor, actor_id, reason, committed_at, postings, related]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/OperationType'
        source:
          $ref: '#/components/schemas/TransactionSource'
        effective_date:
          $ref: '#/components/schemas/EffectiveDate'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        amount_minor:
          type: integer
          format: int64
          nullable: true
        actor_id:
          type: string
          format: uuid
        reason:
          type: string
          nullable: true
        committed_at:
          $ref: '#/components/schemas/Timestamp'
        postings:
          type: array
          items:
            $ref: '#/components/schemas/Posting'
        related:
          type: array
          items:
            $ref: '#/components/schemas/RelatedOperation'
