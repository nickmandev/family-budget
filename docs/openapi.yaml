          schema:
            $ref: '#/components/schemas/EffectiveDate'
        - name: to
          in: query
          description: Inclusive effective-date upper bound in household-local `YYYY-MM-DD`.
          schema:
            $ref: '#/components/schemas/EffectiveDate'
