      type: object
      required: [account_id, name, kind, posted_minor, spendable_minor, reserved_minor]
      properties:
        account_id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/AccountKind'
        posted_minor:
          $ref: '#/components/schemas/MinorUnits'
        spendable_minor:
          $ref: '#/components/schemas/MinorUnits'
        reserved_minor:
          $ref: '#/components/schemas/MinorUnits'
