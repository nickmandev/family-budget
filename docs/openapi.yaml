      type: object
      required: [kind, target_envelope_id, amount_minor]
      properties:
        kind:
          $ref: '#/components/schemas/PlanKind'
        target_envelope_id:
          type: string
          format: uuid
        target_account_id:
          type: string
          format: uuid
          nullable: true
        amount_minor:
          $ref: '#/components/schemas/MinorUnits'
