      type: object
      required: [source_envelope_id, amount_minor]
      properties:
        source_envelope_id:
          type: string
          format: uuid
        amount_minor:
          $ref: '#/components/schemas/MinorUnits'
    AuthorizePlanRequest:
      allOf:
        - $ref: '#/components/schemas/FinancialRequest'
        - type: object
          properties:
            mode:
              $ref: '#/components/schemas/AuthorizationMode'
            reallocation:
              allOf:
                - $ref: '#/components/schemas/PlanReallocation'
              nullable: true
