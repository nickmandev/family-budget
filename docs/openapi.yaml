  /households/{id}/suggestions/{suggestionID}/confirm:
    parameters:
      - $ref: '#/components/parameters/HouseholdID'
      - $ref: '#/components/parameters/SuggestionID'
    post:
      tags: [Suggestions]
      operationId: confirmSuggestion
      summary: Confirm a suggestion as an already-completed external transaction
      description: |
        Confirmation records the externally completed purchase as one committed
        operation and does not pretend the client authorized the real-world
        payment. Financial mutation; requires `Idempotency-Key`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: See the idempotency semantics in the API description.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmSuggestionRequest'
      responses:
        '200':
          description: Suggestion confirmed and operation committed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionConfirmResponse'
        '400':
