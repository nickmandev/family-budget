          properties:
            source_envelope_id:
              type: string
              format: uuid
            destination_envelope_id:
              type: string
              format: uuid
            amount_minor:
              $ref: '#/components/schemas/MinorUnits'
    IncomeRequest:
      allOf:
        - $ref: '#/components/schemas/FinancialRequest'
        - type: object
          required: [account_id, amount_minor]
          properties:
            account_id:
              type: string
              format: uuid
            amount_minor:
              $ref: '#/components/schemas/MinorUnits'
    PurchaseRequest:
      allOf:
        - $ref: '#/components/schemas/FinancialRequest'
        - type: object
          required: [envelope_id, amount_minor]
          properties:
            purchase_kind:
              $ref: '#/components/schemas/PurchaseKind'
            account_id:
              type: string
              format: uuid
              nullable: true
              description: Debit/cash account, or the card account as a fallback.
            card_account_id:
              type: string
              format: uuid
              nullable: true
            envelope_id:
              type: string
              format: uuid
              description: Spending envelope.
            payment_envelope_id:
              type: string
              format: uuid
              nullable: true
              description: Card-payment envelope; required for card purchases.
            amount_minor:
              $ref: '#/components/schemas/MinorUnits'
    CardPaymentRequest:
      allOf:
        - $ref: '#/components/schemas/FinancialRequest'
        - type: object
          required: [account_id, card_account_id, payment_envelope_id, amount_minor]
          properties:
            account_id:
              type: string
              format: uuid
            card_account_id:
              type: string
              format: uuid
            payment_envelope_id:
              type: string
              format: uuid
            amount_minor:
              $ref: '#/components/schemas/MinorUnits'
    CardFeeRequest:
      allOf:
        - $ref: '#/components/schemas/FinancialRequest'
        - type: object
          required: [card_account_id, fee_envelope_id, payment_envelope_id, amount_minor]
          properties:
