openapi: 3.0.3
info:
  title: Family Budget API
  version: 1.0.0
  description: |
    Reviewable external HTTP contract for the household envelope-budgeting MVP.

    This document is the reviewed API contract required by
    `docs/API_CONTRACT.md`, `docs/MVP_SCOPE.md` quality gate 5 and
    `docs/PLATFORM_DECISIONS.md` §C. The API is a versioned REST/JSON surface
    under `/api/v1`; the OpenAPI server URL below carries that prefix and path
    keys are relative to it. Operational probes (`/healthz`, `/readyz`) are
    documented with a root server because they are outside the versioned API.

    ## Date semantics

    `EffectiveDate` is a date-only calendar fact in the household's timezone,
    encoded as `YYYY-MM-DD` (`format: date`). It is never obtained by converting
    an audit instant. Audit timestamps (`created_at`, `updated_at`, `joined_at`,
    `removed_at`, `committed_at`, `expires_at`) are RFC 3339 UTC instants
    (`format: date-time`). Clients must send and interpret them as instants, not
    local wall-clock values.

    ## Authentication and household scope

    All API operations except registration and login require a bearer session
    token (`Authorization: Bearer <token>`). Registration creates only the
    global user identity; the first household is created through
    `POST /households`, which makes the caller its OWNER. Every household-scoped
    operation authorizes membership server-side. A caller who is not an active
    member receives `404 ENTITY_NOT_FOUND_OR_NOT_IN_HOUSEHOLD`, not 403, so
    cross-household existence is not disclosed. `HOUSEHOLD_ACCESS_DENIED` (403)
    is reserved for a known member attempting an owner-only operation.

    ## Idempotency

    Every financial mutation requires an `Idempotency-Key` request header. The
    key is scoped to `(household_id, idempotency_key)` and the request
    fingerprint is the SHA-256 of
    `METHOD + " " + EscapedPath + "\n" + canonicalJSON`. Reusing a key with the
    same canonical request returns the original semantic outcome without
    repeating ledger postings. Reusing it with a different canonical request
    returns `409 IDEMPOTENCY_KEY_PAYLOAD_MISMATCH`. A concurrent duplicate is
    serialized by the database; one request commits and the other observes the
    stored outcome or a retryable `409 CONCURRENCY_CONFLICT`. Idempotency state
    is durable and is never held only in process memory.

    ## Pagination

    Potentially unbounded collections use opaque cursor pagination. Ordering is
    deterministic by `(committed_at, operation UUID)`; the cursor is a
    base64url-encoded position that must be treated as opaque. `limit` defaults
    to 50 and is capped at 200. `next_cursor` is `null` on the final page.
    Cursors are authorized inside the household and cannot read another
    household's data. Only the transaction history and other list responses
    expose `next_cursor`; small bounded collections return it as `null`.

    ## Draft, reserved plan, suggestion and committed transaction

    A **suggestion** is an unconfirmed candidate (manual draft or future
    notification-derived candidate). It has no ledger postings and no
    reservations. Confirming a suggestion records the candidate; confirmation
    as an already-completed external transaction creates a committed operation.
    A **purchase plan** in `DRAFT` is freely editable and holds no funds. After
    `authorize` it becomes `RESERVED` (or `RESERVED_EXCEPTION` for a reasoned
    emergency override) and holds envelope and/or account funds without posting
    an expense. `complete` commits exactly one purchase operation and releases
    the holds; `cancel` releases the holds and posts nothing. A **committed
    transaction** is an immutable journal operation created by income, purchase,
    payment, fee, transfer, refund, reversal, correction or reconciliation
    endpoints. Only the server creates postings; clients cannot post arbitrary
    ledger rows.

    ## Error envelope

    Every error response uses the shape `{"error":{"code","message","field",
    "details","request_id"}}`. Codes are stable and independent of the HTTP
    status; the root `x-error-codes` extension records the code→status mapping
    enforced by the transport. `X-Request-ID` is echoed on every response and
    appears in each error envelope.
servers:
  - url: /api/v1
    description: Versioned API root
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Registration, login, logout and the authenticated principal.
  - name: Households
    description: Household bootstrap, members and household settings.
  - name: Budget
    description: Accounts, envelopes, allocations, reallocations and derived balances.
  - name: Transactions
    description: Committed journal operations and budget resolution.
  - name: Plans
    description: Planned purchases and repayments with reservations.
  - name: Suggestions
    description: Unconfirmed candidate transactions and their transitions.
  - name: Health
    description: Liveness and readiness probes.
x-error-codes:
  BAD_REQUEST: 400
  UNAUTHENTICATED: 401
  INVALID_CREDENTIALS: 401
  HOUSEHOLD_ACCESS_DENIED: 403
  EMAIL_ALREADY_REGISTERED: 409
  ENTITY_NOT_FOUND_OR_NOT_IN_HOUSEHOLD: 404
  NOT_FOUND: 404
  METHOD_NOT_ALLOWED: 405
  INVALID_ENTITY_STATE: 409
  INVALID_AMOUNT: 400
  CURRENCY_MISMATCH: 400
  INSUFFICIENT_READY_TO_ASSIGN: 422
  INSUFFICIENT_ENVELOPE_FUNDS: 422
  INSUFFICIENT_ACCOUNT_FUNDS: 422
  OVERRIDE_REASON_REQUIRED: 400
  RESERVATION_MISMATCH: 409
  AMOUNT_EXCEEDS_AUTHORIZATION: 422
  REFUND_EXCEEDS_REMAINDER: 422
  REVERSAL_EXCEEDS_REMAINDER: 422
  IDEMPOTENCY_KEY_PAYLOAD_MISMATCH: 409
  CONCURRENCY_CONFLICT: 409
  ACCOUNT_SCOPE_CHANGE_REQUIRES_FUNDING_PLAN: 422
  ACCOUNTING_INVARIANT_VIOLATION: 500
  MONEY_OVERFLOW: 422
  AMOUNT_OUT_OF_RANGE: 422
  INVALID_VALUE: 400
  RATE_LIMITED: 429
  PAYLOAD_TOO_LARGE: 413
  REQUEST_TIMEOUT: 504
  SERVICE_UNAVAILABLE: 503
  INTERNAL_ERROR: 500
paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a global user identity
      description: |
        Creates only the global user. Registration is rate limited. The first
        household is created separately with `POST /households`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in and obtain a bearer session token
      description: |
        Returns a session token and its expiry instant. Failures are generic
        (`401 INVALID_CREDENTIALS`) for an unknown email and a wrong password
        alike. The response is not cacheable.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Cache-Control:
              description: Always `no-store` for credential responses.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the presented session
      description: Revokes only the bearer session used for this request.
      responses:
        '204':
          description: Session revoked.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Return the authenticated user and memberships
      responses:
        '200':
          description: Current principal.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /households:
    get:
      tags: [Households]
      operationId: listHouseholds
      summary: List households the caller belongs to
      responses:
        '200':
          description: Households visible to the caller.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    post:
      tags: [Households]
      operationId: createHousehold
      summary: Create a household and make the caller its OWNER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHouseholdRequest'
      responses:
        '201':
          description: Household created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /households/{id}:
    parameters:
      - $ref: '#/components/parameters/HouseholdID'
    get:
      tags: [Households]
      operationId: getHousehold
      summary: Get one household
      description: Non-membership is reported as 404, never 403.
      responses:
        '200':
          description: Household.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /households/{id}/members:
    parameters:
      - $ref: '#/components/parameters/HouseholdID'
    get:
      tags: [Households]
      operationId: listMembers
      summary: List household members
      responses:
        '200':
          description: Members.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    post:
      tags: [Households]
      operationId: addMember
      summary: Add an existing user to the household
      description: Owner-only. The email must belong to an existing user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: Membership created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /households/{id}/members/{userID}:
    parameters:
      - $ref: '#/components/parameters/HouseholdID'
      - $ref: '#/components/parameters/UserID'
    delete:
      tags: [Households]
      operationId: removeMember
      summary: Remove a household member
      description: Owner-only. Removes membership while preserving audit history.
      responses:
        '200':
          description: Membership removed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /households/{id}/accounts:
    parameters:
      - $ref: '#/components/parameters/HouseholdID'
    get:
      tags: [Budget]
      operationId: listAccounts
      summary: List accounts
      parameters:
        - name: include_archived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Accounts.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    post:
      tags: [Budget]
      operationId: createAccount
      summary: Create an account with no balance
      description: |
        Accounts start at zero; establish the opening balance with
        `POST /households/{id}/accounts/{accountID}/opening-balance`. A credit
        card liability cannot be budget eligible.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /households/{id}/accounts/{accountID}:
    parameters:
      - $ref: '#/components/parameters/HouseholdID'
      - $ref: '#/components/parameters/AccountID'
    patch:
      tags: [Budget]
      operationId: updateAccount
      summary: Update an account's name, lifecycle status or budget eligibility
      description: |
        Changing whether an account contributes budgetable cash requires an
        explicit funding plan when it would invalidate the budget identity;
        otherwise it returns `422 ACCOUNT_SCOPE_CHANGE_REQUIRES_FUNDING_PLAN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: Account updated.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /households/{id}/accounts/{accountID}/opening-balance:
    parameters:
      - $ref: '#/components/parameters/HouseholdID'
      - $ref: '#/components/parameters/AccountID'
    post:
      tags: [Budget]
      operationId: recordOpeningBalance
      summary: Record an account opening balance
      description: Financial mutation; requires `Idempotency-Key`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Client-generated key scoped to `(household_id, idempotency_key)`.
            Same key and same canonical request returns the original operation;
            same key with a different request returns
            `409 IDEMPOTENCY_KEY_PAYLOAD_MISMATCH`.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningBalanceRequest'
      responses:
        '201':
          description: Opening balance operation committed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /households/{id}/envelopes:
    parameters:
      - $ref: '#/components/parameters/HouseholdID'
    get:
      tags: [Budget]
      operationId: listEnvelopes
      summary: List envelopes
      parameters:
        - name: include_archived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Envelopes.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    post:
      tags: [Budget]
      operationId: createEnvelope
      summary: Create an envelope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvelopeRequest'
      responses:
        '201':
          description: Envelope created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /households/{id}/envelopes/{envelopeID}:
    parameters:
      - $ref: '#/components/parameters/HouseholdID'
      - $ref: '#/components/parameters/EnvelopeID'
    patch:
      tags: [Budget]
      operationId: updateEnvelope
      summary: Update an envelope's name or lifecycle status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEnvelopeRequest'
      responses:
        '200':
          description: Envelope updated.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /households/{id}/allocations:
    parameters:
      - $ref: '#/components/parameters/HouseholdID'
    post:
      tags: [Budget]
      operationId: allocateFunds
      summary: Allocate ready-to-assign money into an envelope
      description: Financial mutation; requires `Idempotency-Key`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: See the idempotency semantics in the API description.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocationRequest'
      responses:
        '201':
          description: Allocation committed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /households/{id}/reallocations:
    parameters:
      - $ref: '#/components/parameters/HouseholdID'
    post:
      tags: [Budget]
      operationId: reallocateFunds
      summary: Move budget value between envelopes
      description: Financial mutation; requires `Idempotency-Key`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: See the idempotency semantics in the API description.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReallocationRequest'
      responses:
        '201':
          description: Reallocation committed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
