# family-budget — drop-in nginx server block
#
# The API container is published on loopback only (127.0.0.1:8080 by default;
# see API_HOST_PORT in .env). This block terminates TLS with the operator's
# existing Let's Encrypt certificate and proxies to that loopback port.
#
# Requirements: nginx >= 1.25.1 for `http2 on;`. On older versions, replace
# the HTTPS listen lines with `listen 443 ssl http2;` and
# `listen [::]:443 ssl http2;`, and remove the `http2 on;` directive.
#
# CHANGE-ME: replace budget.example.com with the real hostname everywhere in
# this file. The DNS A/AAAA record must already point at this VPS.
#
# Install (see README.md for the short version):
#   sudo cp deploy/nginx/family-budget.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/family-budget.conf \
#       /etc/nginx/sites-enabled/family-budget.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: this host already runs certbot for other projects. Either let
# `certbot --nginx` manage this block exactly as it does for those projects,
# or issue/renew with the existing webroot flow and keep the certificate paths
# below. Do not run a second ACME client inside a container: it would contend
# for ports 80/443 and the HTTP-01 challenge.

# --- HTTP: redirect to HTTPS ------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name budget.example.com;  # CHANGE-ME

    # If certbot uses the webroot method, keep its existing ACME location
    # block (/.well-known/acme-challenge/) ahead of this redirect.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: proxy to the loopback-bound API --------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx >= 1.25.1 uses `http2 on;`. On older nginx, remove this directive
    # and use `listen 443 ssl http2;` plus `listen [::]:443 ssl http2;` above.
    http2 on;
    server_name budget.example.com;  # CHANGE-ME

    # Typical Let's Encrypt paths. If `certbot --nginx` manages this block it
    # inserts these itself; keep its managed lines instead of these two.
    ssl_certificate     /etc/letsencrypt/live/budget.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/budget.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Match the API's HTTP_MAX_BODY_BYTES default (1 MiB; internal/config).
    client_max_body_size 1m;

    # --- Restore the real client IP from Cloudflare -------------------------
    # Cloudflare proxies the request, so without this every client would look
    # like a Cloudflare edge address. Trust only Cloudflare's published ranges;
    # https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6
    # are the source of truth to keep this list in sync when they change.
    # Trusting these ranges is only safe because the origin firewall restricts
    # :80/:443 to them (see README.md); direct origin access would let callers
    # spoof CF-Connecting-IP.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/problem+json text/plain;

    # Same security headers the previous reverse-proxy config carried.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location / {
        # Keep in sync with API_HOST_PORT in .env (default 8080).
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr now carries the real client IP restored by the
        # set_real_ip_from block above, so X-Real-IP is not the Cloudflare edge.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

# --- Optional local testing without Let's Encrypt --------------------------
# For a local self-signed check, generate a certificate:
#   openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#     -keyout /etc/ssl/private/family-budget.key \
#     -out /etc/ssl/certs/family-budget.crt -subj "/CN=localhost"
# then uncomment this block and browse https://localhost:8443.
