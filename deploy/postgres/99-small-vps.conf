# PostgreSQL 18.6 tuning for a small, shared Hetzner VPS (family-budget).
#
# compose.yaml mounts this file read-only at /etc/postgresql/99-small-vps.conf
# and starts postgres with `-c config_file=/etc/postgresql/99-small-vps.conf`.
# Despite the 99- prefix it is NOT a conf.d drop-in: the official image's
# initdb-generated postgresql.conf has no include_dir, so this file is passed
# explicitly as the main configuration file.
#
# The first directive loads the initdb-generated file (which sets
# listen_addresses = '*' and other image defaults); everything after it
# overrides only the settings that matter on a constrained host.
#
# The path includes the PostgreSQL major version because postgres:18.6 keeps
# PGDATA at /var/lib/postgresql/18/docker. Update it if the image major changes.
include = '/var/lib/postgresql/18/docker/postgresql.conf'

# --- Memory -----------------------------------------------------------------
# 128 MB is enough to cache a household budget's working set while leaving the
# rest of the box for nginx, Calibre and the other projects. Bigger values
# mostly duplicate the host page cache on a shared VPS.
shared_buffers = 128MB

# Planner hint only (not an allocation): tell PostgreSQL roughly 512 MB of the
# host's page cache is available to this database, so it does not over-favour
# sequential scans. Conservative because the cache is shared with other apps.
effective_cache_size = 512MB

# Per sort/hash operation. Small queries dominate; 4 MB bounds the worst case
# across 25 connections (~100 MB) while avoiding spills for normal reports.
work_mem = 4MB

# Per maintenance operation (VACUUM, index build). 64 MB is ample for a small
# database; autovacuum runs at most three workers, so budget ~192 MB peak.
maintenance_work_mem = 64MB

# Per-session temporary table buffer; 8 MB is plenty for household-sized work.
temp_buffers = 8MB

# 10 API pool connections (DATABASE_MAX_OPEN_CONNS default) + migrate + the
# healthcheck + an operator psql session fit inside 25. Raising this without
# raising the pool only wastes memory.
max_connections = 25

# --- WAL and checkpoints -----------------------------------------------------
# 4 MB matches the auto-tuned default for 128 MB shared_buffers and avoids
# relying on auto-tuning surprises after a settings change.
wal_buffers = 4MB

# Low traffic: keep a modest WAL ceiling so checkpoints are infrequent but WAL
# does not grow without bound on a small disk.
min_wal_size = 128MB
max_wal_size = 1GB

# Spread checkpoints over 15 minutes instead of the 5-minute default; fewer
# fsync bursts matter on a shared VPS with other I/O users.
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# --- Planner / CPU ----------------------------------------------------------
# Hetzner VPS disks are SSDs; 1.1 reflects random-read cost and lets the
# planner use indexes for the small selective queries this API issues.
random_page_cost = 1.1

# Two parallel workers at most: the database is capped at 0.75 CPU anyway and
# the host has other work to do.
max_parallel_workers = 2

# JIT compilation costs more than it saves for the small, index-driven queries
# this application runs; disabling it removes a CPU/memory surprise.
jit = off
